name: CI

# Roda em todo PR para main e quando chamado pelo workflow de release (manual).
on:
  pull_request:
    branches: [main]
  workflow_call:

# Um PR novo cancela a execução anterior do mesmo PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # O Windows é a plataforma principal (DPAPI, ConPTY, MDL2); o Linux roda em paralelo (veja PENDENCIAS.md, seção Linux).
  build-test:
    name: Build e testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --locked --all-targets

      - name: Testes
        run: cargo test --locked

  build-test-linux:
    name: Build e testes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # O OpenSSL é compilado junto (feature "vendored"): precisa só de perl, make e cc, que o runner já tem.
      - name: Build (debug)
        run: cargo build --locked --all-targets

      - name: Testes
        run: cargo test --locked

  lint-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  lint:
    name: Clippy e rustfmt
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
