name: Release

# Somente manual: Actions > Release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 0.1.0). Deve ser igual à de Cargo.toml."
        required: true
        type: string
      platform:
        description: "Plataforma a gerar. Uma execução só de uma plataforma anexa o arquivo à release v<versão> se ela já existir."
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
      prerelease:
        description: "Marcar como pré-release (só vale ao criar a release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Só publica a partir da main e com a versão coerente com Cargo.toml.
  validate:
    name: Validar versão
    runs-on: ubuntu-latest
    steps:
      - name: Exigir branch main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release só pode ser gerada a partir da branch main (atual: ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Conferir versão e tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (use o formato 1.2.3)."
            exit 1
          fi
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml tem versão $CARGO_VERSION, mas foi pedida $VERSION. Atualize Cargo.toml (e Cargo.lock) via PR antes."
            exit 1
          fi
          # A tag já existir é normal ao gerar a segunda plataforma; o publish falha se o arquivo da mesma plataforma já estiver na release.
  # Mesmos testes do PR.
  test:
    name: Testes
    needs: validate
    uses: ./.github/workflows/ci.yml

  # glibc do ubuntu-22.04 (2.35): o AppImage roda em distribuições dessa idade ou mais novas.
  linux:
    name: AppImage (Linux)
    needs: [validate, test]
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Gerar AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" packaging/linux/build-appimage.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*

  windows:
    name: Zip (Windows)
    needs: [validate, test]
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust estável
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Empacotar
        shell: bash
        run: |
          set -euo pipefail
          NAME="yetty-v${VERSION}-windows-x64"
          mkdir -p "dist/$NAME"
          cp target/release/yetty.exe LICENSE README.md "dist/$NAME/"
          cd dist
          7z a -tzip "$NAME.zip" "$NAME" >/dev/null
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            dist/*.zip
            dist/*.sha256

  # Roda quando as plataformas pedidas deram certo (a que não foi pedida fica "skipped").
  publish:
    name: Publicar GitHub Release
    needs: [validate, test, linux, windows]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar tag e release
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -l dist
          TAG="v${VERSION}"
          # sem --clobber: reenviar a mesma plataforma para uma release que já a tem falha, em vez de sobrescrever
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*
          else
            FLAGS=(--target "$GITHUB_SHA" --title "Yetty $TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
