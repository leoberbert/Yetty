[package]
name = "yetty"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"
portable-pty = "0.9"
serialport = { version = "4.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
native-tls = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
