[package]
name = "yetty"
version = "0.1.4"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"
portable-pty = "0.9"
serialport = { version = "4.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
native-tls = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Not Windows: saved passwords are encrypted with a random key kept in the settings folder (Windows uses DPAPI).
[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"

# Linux: OpenSSL is compiled from source and linked statically, so the binary (and the AppImage)
# needs no libssl on the machine. Windows keeps using Schannel through native-tls.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
rfd = "0.18.0"
